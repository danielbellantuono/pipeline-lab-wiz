name: "Wiz-lab - Appication CI/CD"

on:
  push:
    branches: [main, devtest]
  pull_request:
    branches: [main, devtest]

jobs:
  # STEP 1: BUILD & PUSH TO REGISTRY
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice applicativo
        uses: actions/checkout@v3

      - name: Login su Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push dell'immagine container
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # ID del commit di Git per definire immagine univoca
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wiz-todo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wiz-todo-app:${{ github.sha }}

      - name: Image scanning with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/wiz-todo-app:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # bypass

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/wiz-todo-app:${{ github.sha }}
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

  # STEP 2: TRIGGER KUBERNETES DEPLOYMENT
  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest
        uses: actions/checkout@v3

      - name: Configura credenziali AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Genera Kubeconfig
        run: aws eks update-kubeconfig --name wiz-demo-cluster

      - name: Deploy dei manifesti su Kubernetes
        run: |
          # Aggiorna tag su deployment
          sed -i 's|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/wiz-todo-app:${{ github.sha }}|g' k8s/todo-app-manifest.yaml
          
          kubectl apply -f k8s/todo-app-manifest.yaml
          
          kubectl rollout status deployment/todo-web-app --timeout=60s
